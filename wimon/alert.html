<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intrusion Detected</title>
<style>
  :root {
    --red: #ff2a2a;
    --red-dim: #8a0f0f;
    --amber: #ffb020;
    --text: #f4f4f4;
    --muted: #b9b9b9;
    --bg: #050000;
    --mono: "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(ellipse at center, #2a0000 0%, var(--bg) 70%);
    color: var(--text);
    font-family: var(--sans);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3vh 4vw;
    user-select: none;
    cursor: default;
  }
  /* scanlines and a slow sweeping band, like an old monitor */
  body::before, body::after { content: ""; position: fixed; inset: 0; pointer-events: none; }
  body::before {
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.35) 0 1px, transparent 1px 3px);
    z-index: 3;
  }
  body::after {
    background: linear-gradient(180deg, transparent, rgba(255,42,42,.08), transparent);
    height: 30vh;
    animation: sweep 4s linear infinite;
    z-index: 3;
  }
  @keyframes sweep { from { transform: translateY(-30vh); } to { transform: translateY(100vh); } }

  .frame {
    position: fixed; inset: 1.5vh 1.5vw;
    border: 3px solid var(--red);
    box-shadow: 0 0 40px var(--red), inset 0 0 40px rgba(255,42,42,.4);
    animation: pulse 1s steps(2) infinite;
    pointer-events: none;
    z-index: 2;
  }
  @keyframes pulse { 50% { border-color: var(--red-dim); box-shadow: none; } }

  main {
    position: relative; z-index: 4;
    width: min(1100px, 100%);
    max-height: 100%;
    display: flex; flex-direction: column;
    gap: clamp(10px, 2.2vh, 26px);
    min-height: 0;
  }

  .banner { text-align: center; }
  .tag {
    font: 600 clamp(11px, 1.5vh, 15px)/1 var(--mono);
    letter-spacing: .35em;
    color: var(--red);
  }
  h1 {
    font: 800 clamp(34px, 9vh, 112px)/1 var(--sans);
    letter-spacing: .04em;
    color: var(--red);
    text-shadow: 0 0 24px rgba(255,42,42,.8);
    margin-top: 1vh;
    position: relative;
    animation: flicker 3s infinite;
  }
  h1::before, h1::after {
    content: attr(data-text);
    position: absolute; inset: 0;
    overflow: hidden;
  }
  h1::before { color: #00e5ff; opacity: .5; animation: glitch 2.2s infinite steps(1); }
  h1::after  { color: #fff;    opacity: .35; animation: glitch 1.7s infinite reverse steps(1); }
  @keyframes glitch {
    0%, 86%, 100% { clip-path: inset(0 0 100% 0); transform: none; }
    88% { clip-path: inset(10% 0 60% 0); transform: translateX(-6px); }
    92% { clip-path: inset(55% 0 20% 0); transform: translateX(6px); }
    96% { clip-path: inset(30% 0 40% 0); transform: translateX(-3px); }
  }
  @keyframes flicker { 0%, 97%, 100% { opacity: 1; } 98% { opacity: .4; } }
  .threat {
    font: 700 clamp(16px, 3vh, 32px)/1.2 var(--sans);
    margin-top: 1.4vh;
    overflow-wrap: anywhere;
  }

  .grid {
    display: grid;
    grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
    gap: clamp(10px, 2vw, 24px);
    min-height: 0;
  }
  .panel {
    border: 1px solid rgba(255,42,42,.55);
    background: rgba(20,0,0,.72);
    padding: clamp(12px, 2vh, 22px);
    min-width: 0; min-height: 0;
    overflow: hidden;
  }
  .panel h2 {
    font: 600 clamp(10px, 1.3vh, 13px)/1 var(--mono);
    letter-spacing: .25em;
    color: var(--red);
    margin-bottom: 1.4vh;
  }
  .readout { font: clamp(11px, 1.7vh, 16px)/1.65 var(--mono); }
  .readout div { display: flex; gap: 1ch; min-width: 0; }
  .readout .k { color: var(--muted); flex: 0 0 14ch; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .readout .v { color: var(--text); overflow-wrap: anywhere; min-width: 0; }
  .readout .v.hot { color: var(--red); font-weight: 700; }
  .readout .v.ok  { color: #38e07b; font-weight: 700; }
  .readout div { opacity: 0; animation: type .01s forwards; }
  @keyframes type { to { opacity: 1; } }
  .cursor::after { content: "█"; animation: blink .8s steps(1) infinite; color: var(--red); }
  @keyframes blink { 50% { opacity: 0; } }

  .plain p { font-size: clamp(13px, 2vh, 19px); line-height: 1.5; }
  .plain h3 {
    font: 700 clamp(12px, 1.7vh, 16px)/1.2 var(--sans);
    margin: 1.8vh 0 .8vh;
    color: var(--amber);
  }
  .plain ol { padding-left: 1.3em; font-size: clamp(12px, 1.8vh, 17px); line-height: 1.5; }

  .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  button {
    font: 600 clamp(12px, 1.8vh, 16px)/1 var(--sans);
    padding: clamp(10px, 1.6vh, 15px) clamp(16px, 2vw, 28px);
    border-radius: 4px;
    border: 1px solid var(--red);
    background: transparent;
    color: var(--text);
    cursor: pointer;
    letter-spacing: .03em;
  }
  button:hover { background: rgba(255,42,42,.15); }
  button.primary { background: var(--red); color: #000; border-color: var(--red); }
  button.primary:hover { background: #ff5050; }
  button[hidden] { display: none; }

  @media (max-width: 760px), (max-height: 560px) {
    .grid { grid-template-columns: minmax(0, 1fr); }
    .plain ol { display: none; }
  }
</style>
</head>
<body>
<div class="frame"></div>
<main>
  <header class="banner">
    <div class="tag" id="tag">⚠ SECURITY ALERT · WI-FI INTRUSION MONITOR</div>
    <h1 data-text="INTRUSION DETECTED">INTRUSION DETECTED</h1>
    <div class="threat" id="title"></div>
  </header>

  <section class="grid">
    <div class="panel">
      <h2>// THREAT REPORT</h2>
      <div class="readout" id="readout"></div>
    </div>
    <div class="panel plain">
      <h2>// WHAT THIS MEANS</h2>
      <p id="explanation"></p>
      <h3>What to do now</h3>
      <ol id="steps"></ol>
    </div>
  </section>

  <nav class="actions">
    <button class="primary" id="dismiss">I understand</button>
    <button id="disconnect" hidden>Disconnect Wi-Fi now</button>
    <button id="reconnect" hidden>Reconnect anyway</button>
    <button id="trust">I trust this network</button>
  </nav>
</main>

<script>
  // The app sets window.WIMON before this runs. Opened in a browser, it shows a demo.
  const A = window.WIMON || {
    title: "Man-in-the-middle attack (ARP spoofing)",
    explanation: "Another device on this Wi-Fi is pretending to be the router. Your internet traffic was flowing through that device first, so it could read or change what you send and receive.",
    rows: [
      ["THREAT", "ARP_SPOOF", "hot"],
      ["SEVERITY", "CRITICAL", "hot"],
      ["SOURCE IP", "192.168.0.66", "hot"],
      ["SOURCE MAC", "de:ad:be:ef:00:66"],
      ["NETWORK", "router 192.168.0.1"],
      ["REAL ROUTER", "50:91:e3:f6:0a:de"],
      ["TARGET", "THIS DEVICE"],
      ["DETECTED", new Date().toLocaleTimeString()],
      ["ACTION", "WI-FI DISCONNECTED", "ok"],
    ],
    steps: [
      "Stay off this Wi-Fi. Use mobile data or a hotspot you control.",
      "If you logged in to anything on this network, change that password from a safe connection.",
      "If this is your own home Wi-Fi, restart the router and change its Wi-Fi password.",
    ],
    disconnected: true,
  };

  document.getElementById("title").textContent = A.title;
  document.getElementById("explanation").textContent = A.explanation;
  const steps = document.getElementById("steps");
  A.steps.forEach(s => { const li = document.createElement("li"); li.textContent = s; steps.appendChild(li); });

  // Type the readout in one line at a time.
  const readout = document.getElementById("readout");
  A.rows.forEach(([k, v, cls], i) => {
    const row = document.createElement("div");
    row.style.animationDelay = (0.25 + i * 0.18) + "s";
    row.innerHTML = '<span class="k"></span><span class="v"></span>';
    row.firstChild.textContent = "> " + k;
    row.lastChild.textContent = v;
    if (cls) row.lastChild.classList.add(cls);
    readout.appendChild(row);
  });
  const end = document.createElement("div");
  end.className = "cursor";
  end.style.animationDelay = (0.25 + A.rows.length * 0.18) + "s";
  readout.appendChild(end);

  document.getElementById(A.disconnected ? "reconnect" : "disconnect").hidden = false;

  const send = action => {
    if (window.webkit && webkit.messageHandlers && webkit.messageHandlers.wimon) {
      webkit.messageHandlers.wimon.postMessage(action);  // macOS
    } else if (window.pywebview && pywebview.api) {
      pywebview.api.action(action);  // Windows
    }
  };
  ["dismiss", "disconnect", "reconnect", "trust"].forEach(id =>
    document.getElementById(id).addEventListener("click", () => send(id)));
  document.addEventListener("keydown", e => { if (e.key === "Escape") send("dismiss"); });
</script>
</body>
</html>
